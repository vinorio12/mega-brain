<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030405">
<meta name="color-scheme" content="dark">
<title>Mega Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<!-- Estrutura: cabeçalho, 3 áreas (núcleo | terminal | telemetria) e rodapé de status. -->
<div class="app" id="app" data-state="boot">

  <header class="head">
    <div class="ident"><b>MB</b><i>//</i><span>CORE</span><small id="h-ver"></small></div>
    <div class="head-fields">
      <span class="hf hf-state" id="h-state" title="estado da aplicação"><i class="dot"></i><b>BOOT</b></span>
      <span class="hf hf-user" title="sessão"><span class="k">◈</span><b id="h-user">vini</b></span>
      <span class="hf" id="h-net" title="rede"><span class="k">⇅</span><b>NA</b></span>
      <span class="hf" id="h-mem" title="memória"><span class="k">◫</span><b>NA</b></span>
      <span class="hf" id="h-wx" title="clima"><span class="k">◌</span><b>NA</b></span>
      <span class="hf hf-clock"><b class="hf-date" id="h-date">--</b><b id="h-clock">--:--:--</b></span>
    </div>
  </header>

  <aside class="intel" aria-label="Núcleo">
    <div class="ph"><span>núcleo</span><span class="ph-r" id="core-label">—</span></div>
    <div class="core-wrap"><svg id="core" viewBox="-100 -100 200 200" aria-hidden="true"></svg></div>
    <dl class="kv" id="core-kv"></dl>
    <div class="intel-more">
      <div class="ph"><span>atividade · 30 min</span><span class="ph-r" id="act-sum">0</span></div>
      <div class="spark" id="spark"></div>
      <div class="ph"><span>processos</span><span class="ph-r" id="proc-n">0</span></div>
      <ul class="rows" id="procs"></ul>
      <div class="ph"><span>eventos</span><span class="ph-r" id="ev-n">0</span></div>
      <ul class="rows ev" id="events"></ul>
    </div>
  </aside>

  <main class="work">
    <div class="work-h"><span>terminal</span><span class="work-meta" id="work-meta"></span></div>
    <div class="out" id="out" role="log" aria-live="polite"></div>
    <form class="prompt" id="form" autocomplete="off">
      <label for="cmd" class="ps"><span class="ps-who">vini@core</span><span class="ps-path">:~</span><span class="ps-caret">›</span></label>
      <input id="cmd" name="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="escreva qualquer coisa · /ajuda">
      <span class="hint" id="hint"></span>
    </form>
  </main>

  <aside class="tele" aria-label="Telemetria">
    <section>
      <div class="ph"><span>hoje</span><span class="ph-r" id="t-date"></span></div>
      <div class="big" id="t-today">0</div>
      <div class="sub">entradas capturadas</div>
    </section>
    <section>
      <div class="ph"><span>semana</span><span class="ph-r" id="t-week-sum">0</span></div>
      <div class="week" id="t-week"></div>
    </section>
    <section>
      <div class="ph"><span id="t-year-title">ano</span><span class="ph-r" id="t-year-pct"></span></div>
      <div class="meter"><i id="t-year-bar"></i></div>
      <div class="sub" id="t-year"></div>
    </section>
    <section>
      <div class="ph"><span>memória</span></div>
      <ul class="list">
        <li><span>entradas</span><b id="t-total">0</b></li>
        <li><span>desde</span><b id="t-since">NA</b></li>
        <li><span>tamanho</span><b id="t-size">NA</b></li>
        <li><span>destino</span><b id="t-dest">NA</b></li>
      </ul>
    </section>
    <section>
      <div class="ph"><span>tags</span></div>
      <ul class="list" id="t-tags"></ul>
    </section>
    <section>
      <div class="ph"><span>módulos</span></div>
      <ul class="list mods" id="t-mods"></ul>
    </section>
  </aside>

  <footer class="foot" id="foot"></footer>
</div>
</body>
</html>
